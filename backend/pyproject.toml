[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.4.0"  # software release; BENCHMARK_VERSION (gauntlet/__init__.py) stays 0.3.0
description = "Adversarial evaluation framework for AI-engineered software (research prototype)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools.packages.find]
include = ["gauntlet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: requires a reachable PostgreSQL 16 server (GAUNTLET_PG_DSN)",
    "slow: end-to-end benchmark runs",
]
