name: CI

# Runs the whole backend suite against a real PostgreSQL 16 server. Nothing is skipped silently: the
# "PostgreSQL is reachable" step fails the job before pytest starts if the server is not there, so the
# database tests can never skip their way to a green result.

on:
  push:
    branches: [main, "gauntlet/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Frozen evidence checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256 of the frozen benchmark evidence
        working-directory: evidence
        run: sha256sum -c ./*.sha256

  backend-linux:
    name: Backend (Linux, Python ${{ matrix.python }}, PostgreSQL 16 via Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install GAUNTLET with the pinned dependency versions
        run: pip install -c backend/constraints.txt -e "backend[dev]"
      - name: Start PostgreSQL 16 (docker-compose.yml)
        run: docker compose up -d --wait
      - name: PostgreSQL is reachable and is version 16
        working-directory: backend
        run: |
          out="$(python -m gauntlet pg check)"
          echo "$out"
          echo "$out" | grep -q '"is_pg16": true'
      - name: Test suite
        working-directory: backend
        run: python -m pytest -q -rs --durations=15
      - name: Demonstration script
        run: bash scripts/run_demo.sh
      - name: PostgreSQL log
        if: failure()
        run: docker compose logs --tail 200

  backend-windows:
    name: Backend (Windows, Python 3.14, portable PostgreSQL 16)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install GAUNTLET with the pinned dependency versions
        run: pip install -c backend/constraints.txt -e "backend[dev]"
      - name: Install, initialise and start the local PostgreSQL 16 cluster
        working-directory: backend
        run: |
          python -m gauntlet pg install
          python -m gauntlet pg init
          python -m gauntlet pg start > ../pg-start.log 2>&1 < /dev/null
      - name: PostgreSQL is reachable and is version 16
        working-directory: backend
        run: |
          out="$(python -m gauntlet pg check)"
          echo "$out"
          echo "$out" | grep -q '"is_pg16": true'
      - name: Test suite
        working-directory: backend
        run: python -m pytest -q -rs --durations=15
      - name: Demonstration script
        run: bash scripts/run_demo.sh

  frontend:
    name: Dashboard (typecheck and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
